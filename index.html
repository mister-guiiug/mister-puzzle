<!doctype html>
<html lang="fr">
  <head>
    <!-- CSP injected at build by cspPlugin (@mister-guiiug/dev-pwa-config/vite-csp) -->
    <script>
      (function () {
        try {
          var k = 'mister_puzzle_theme';
          var t = localStorage.getItem(k);
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = t === 'dark' || ((t === 'system' || t === null) && sys);
          if (t === 'light') dark = false;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS, ET C'EST LE POINT DE
      CETTE PR.

      `pwaSeoPlugin` les remplaçait, AU BUILD, par le tag de Google dès que
      `VITE_POSTHOG_KEY` était posée — précédé d'un `consent default`
      tout refusé, donc sans collecte, mais le script partait quand même au
      chargement de la page.

      `ConsentBanner` fait le même travail autrement : il n'injecte RIEN tant
      que l'utilisateur n'a pas accepté. Garder les deux chemins ferait partir
      DEUX tags le jour où la variable serait posée — le socle porte deux
      réponses à la même question, et cette app n'en garde qu'une.
    -->
    <!--
      CHEMINS RELATIFS, PAS ABSOLUS. Un href commençant par « / » vise la racine
      du DOMAINE — `mister-guiiug.github.io/logo.svg` — alors que l'application
      est servie sous `/mister-puzzle/`. Les trois liens rendaient donc 404 en
      production, sans que rien ne le signale : le manifeste, lui, déclare ses
      icônes en relatif et les trouvait. Un chemin relatif se résout contre le
      chemin de base, quel qu'il soit.
    -->
    <link rel="icon" type="image/svg+xml" href="logo.svg__PWA_ICON_QS__" />
    <link
      rel="alternate icon"
      type="image/png"
      href="pwa-192x192.png__PWA_ICON_QS__"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png__PWA_ICON_QS__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#4f46e5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1e1b2e"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Mister Puzzle — suivi collaboratif de puzzles : pièces en direct, photos, checkpoints, graphique, PWA. Partagez un code et avancez à plusieurs."
    />
    <meta
      name="keywords"
      content="puzzle, jigsaw, progression, collaboratif, temps réel, PWA, Firebase, photos, checkpoints, suivi pièces"
    />
    <meta name="application-name" content="Mister Puzzle" />
    <meta name="author" content="mister-guiiug" />
    <meta name="robots" content="index, follow" />
    <meta
      name="google-site-verification"
      content="iUfQ7_dOztC3XoSGesC2b7IkxyNL2O9fegKXECoOg30"
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister Puzzle" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Mister Puzzle - suivi collaboratif de progression de puzzle"
    />
    <meta
      property="og:description"
      content="Suivez un puzzle à plusieurs : pièces placées ou restantes, historique, photos, checkpoints. Web app installable (PWA), français et anglais."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

      name="twitter:description"

    <title>Mister Puzzle - suivi collaboratif de progression de puzzle</title>
  </head>
