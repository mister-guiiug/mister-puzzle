# Tests des Security Rules RTDB sur l'émulateur Firebase.
#
# C'est le SEUL endroit où les règles de `database.rules.json` s'exécutent pour
# de bon avant d'être déployées par `deploy.yml`. Le run vitest principal
# (`ci.yml`) tourne sans émulateur et ne les voit pas.
name: Rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Security Rules (émulateur RTDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-pwa-config/.github/actions/setup-pwa@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # L'émulateur RTDB (firebase-tools ≥ 15) exige Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Tests des rules (émulateur)
        run: npm run test:rules
