# CI déléguée au reusable workflow famille (dev-pwa-config).
# Le build client exige des VITE_FIREBASE_* → injectés via `build-env` (factices).
# Le backend `server/` est type-checké via `server-dir`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `doctor-strict` reste à `false`, et voici pourquoi. Mesuré le 19/09/2026
      # en jouant `--strict` pour de vrai sur ce dépôt : le docteur rend
      # « 0 défaut(s), 4 dette(s) », et `--strict` échoue sur une dette
      # (pwa-doctor.mjs:1631). Ce qui bloque aujourd'hui :
      #   · les VITE_FIREBASE_* en secret alors que Vite les copie dans le bundle
      #   · .env.example ne documente pas VITE_ERROR_INGEST_URL, VITE_PWA_ICON_QS
      #   · code source + soutien sur tous les écrans, rendus par la coquille
      # Le mode strict s'active quand cette liste est vide. Pas avant : une CI
      # rouge sur une dette connue et non traitée n'apprend rien à personne.
      run-e2e: true
      # `.*` : TOUTE la suite. Le docteur le disait en dette — « e2e/basic.spec.ts :
      # aucun titre ne correspond au filtre @critical|@a11y, jamais joué en CI ».
      # Playwright rend « No tests found » avec un code 0 pour une spec qu'il
      # ignore : le job sortait vert sans avoir joué ce fichier.
      #
      # Mesuré le 19/09/2026 avec la commande exacte du réutilisable : 8 tests sous
      # le défaut du socle, 24 sous `.*`, tous verts — et 17,7 s au lieu de 9,5.
      # Huit secondes pour seize tests de plus, dans un job qui en dépense une
      # soixantaine en installation. Un filtre qui coûte de la couverture et ne
      # rend rien, on ne le garde pas (cf. miss-badminton).
      e2e-grep: '.*'
      server-dir: server
      build-env: |
        VITE_PUBLIC_SITE_ORIGIN=https://example.github.io
        VITE_FIREBASE_API_KEY=ci-dummy-key
        VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com
        VITE_FIREBASE_DATABASE_URL=https://dummy.firebaseio.com
        VITE_FIREBASE_PROJECT_ID=dummy-ci
        VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
        VITE_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000
