# Déploiement GitHub Pages, délégué au réutilisable de la famille.
#
# CE FICHIER ÉTAIT ÉCRIT À LA MAIN tant que les `VITE_FIREBASE_*` vivaient dans
# `secrets` : le bloc `with:` d'un job `uses:` n'a pas accès au contexte
# `secrets`, et GitHub refusait le fichier entier (relevé du 06/09/2026). Elles
# sont depuis en `vars` — publiques par construction, Vite les copie dans le
# bundle. La copie manuelle avait un coût, mesuré le 29/09/2026 : ni `lastmod`
# réel ni IndexNow, que `pwa-deploy.yml` apporte depuis le socle 6.19.0, et un
# `404.html` indexable.
#
# PAS DE `concurrency` ICI : le réutilisable déclare déjà le sien (`group:
# pages`). Redoublé dans l'appelant, GitHub refuse le fichier AVANT de créer un
# seul job, sans autre message que « workflow file issue ».
#
# LES RÈGLES DE LA BASE PARTENT D'ABORD, DANS LEUR JOB. Le réutilisable sait
# les déployer, mais avec un compte de service (`FIREBASE_SERVICE_ACCOUNT_KEY`)
# que ce dépôt n'a pas : il n'a que `FIREBASE_TOKEN`. Le site ne part qu'une
# fois les règles en place, comme avant.
name: Build & Deploy Mister Puzzle

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'

      - name: Deploy Firebase Database Rules
        uses: mister-guiiug/dev-pwa-config/.github/actions/firebase-deploy@v6
        with:
          project-id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          only: database
          token: ${{ secrets.FIREBASE_TOKEN }}

  deploy:
    needs: firebase-rules
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    with:
      use-base-path: true
      # Le DSN Sentry n'est PAS un secret : il part dans le bundle, comme toute
      # `VITE_*`. Absent, `initSentry` rend `null` sans importer le SDK.
      build-env: |
        VITE_PUBLIC_SITE_ORIGIN=https://${{ github.repository_owner }}.github.io
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
        VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_DATABASE_URL=${{ vars.VITE_FIREBASE_DATABASE_URL }}
        VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
      # `getFirebaseWebConfig()` lève si l'une manque : l'app ne démarre pas.
      required-env: |
        VITE_FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_DATABASE_URL
        VITE_FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID
