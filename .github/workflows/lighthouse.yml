# Lighthouse délégué au reusable workflow famille (dev-pwa-config).
# Le build mesuré est fait avec VITE_BASE_PATH=/ (défaut) pour servir dist/ à la
# racine. `build-env` fournit des VITE_FIREBASE_* factices : `src/firebase.ts`
# appelle `getFirebaseWebConfig()` au chargement du module, qui lève si une
# variable manque — la page ne peignait alors jamais rien (Lighthouse NO_FCP) et
# le garde-fou d'accessibilité ne mesurait plus rien.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-lighthouse.yml@v4
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      # Mêmes valeurs factices que ci.yml (jamais des secrets) : Lighthouse
      # audite la page d'accueil, aucun appel Firebase n'aboutit ni n'est requis.
      build-env: |
        VITE_PUBLIC_SITE_ORIGIN=https://example.github.io
        VITE_FIREBASE_API_KEY=ci-dummy-key
        VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com
        VITE_FIREBASE_DATABASE_URL=https://dummy.firebaseio.com
        VITE_FIREBASE_PROJECT_ID=dummy-ci
        VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
        VITE_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000
