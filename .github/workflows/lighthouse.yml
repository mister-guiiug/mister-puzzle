# Lighthouse délégué au reusable workflow famille (dev-wpa-config).
# Le build mesuré est fait avec VITE_BASE_PATH=/ (défaut) pour servir dist/ à la
# racine. Si le build exige des variables Firebase, ajouter `build-env`.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-lighthouse.yml@v3
    secrets: inherit
